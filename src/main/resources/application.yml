server:
  port: ${PORT:8080}

spring:
  application:
    name: splitwise
  # Defaults to an in-memory H2 database so the app runs with zero setup.
  # In Docker / production, override with SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: jdbc:h2:mem:splitwise;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    # Base64-encoded HMAC key (>= 256 bits). ALWAYS override JWT_SECRET in production.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
