services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: splitwise
      MYSQL_USER: splitwise
      MYSQL_PASSWORD: splitwise
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usplitwise", "-psplitwise"]
      interval: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/splitwise?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: splitwise
      SPRING_DATASOURCE_PASSWORD: splitwise
      JWT_SECRET: ${JWT_SECRET:-ZG9ja2VyLWNvbXBvc2UtZGV2LXNlY3JldC1jaGFuZ2UtbWUtMTIzNDU2Nzg5MA==}
    ports:
      - "8080:8080"

volumes:
  mysqldata:
